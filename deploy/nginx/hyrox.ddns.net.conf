# Hyrox Control — bloc de nginx per a hyrox.ddns.net.
#
# ⚠️ FITXER PROPI, SEPARAT DEL D'ARCHER. Va a
# /etc/nginx/sites-available/hyrox.ddns.net i s'activa amb un enllaç a
# sites-enabled. No modifica cap altre bloc: el d'Archer (sherlocksq2.ddns.net)
# i els altres dos continuen igual.
#
# Només HTTP (port 80). El bloc HTTPS (443) i la redirecció d'HTTP a HTTPS els
# afegeix `certbot --nginx -d hyrox.ddns.net`, que només edita aquest fitxer.

server {
    listen 80;
    listen [::]:80;
    server_name hyrox.ddns.net;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # Les Server Actions de Next.js comparen l'origen de la petició amb el
        # host: sense aquestes capçaleres, desar un formulari fallaria.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
